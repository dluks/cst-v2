[project]
name = "cit-sci-traits"
version = "0.1.0"
description = ""
authors = [{ name = "Daniel Lusk", email = "daniel.lusk@geosense.uni-freiburg.de" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "python-dotenv>=1.0.1",
    "ipykernel>=6.29.3",
    "pandas>=2.2.1",
    "rioxarray>=0.15.1",
    "rasterio>=1.3.9",
    "pyogrio>=0.7.2",
    "pyyaml>=6.0.1",
    "numpy>=1.26.4",
    "matplotlib>=3.8.3",
    "ipywidgets>=8.1.2",
    "python-box>=7,<8",
    "seaborn>=0.13.2",
    "cartopy>=0.23.0",
    "geopandas>=0.14.3",
    "pyarrow>=16.0.0",
    "dask-geopandas>=0.3.1",
    "dask[dataframe]>=2024.4.2",
    "joblib>=1.4.2",
    "tqdm>=4.66.4",
    "h3>=3.7.7",
    "pykrige>=1.7.1",
    "utm>=0.7.0",
    "bokeh>=3.4.1",
    "setuptools>=69.5.1",
    "wheel>=0.43.0",
    "statsmodels>=0.14.2",
    "tabulate>=0.9.0",
    "scikit-learn>=1.4,<1.5",
    "rio-cogeo>=5.3.6",
    "ease-grid>=0.2",
    "openpyxl>=3.1.5",
    "simple-slurm>=0.3.6",
    "zarr>=3.1.5",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.0.0",
    "cupy-cuda12x>=13.6.0",
    # "cudf-cu11>=24.10.0",
    # "cuml-cu11>=24.10.0",
]
analysis = [
    "adjusttext>=1.3.0",
    "python-docx>=1.1.2",
]

[dependency-groups]
dev = [
    "pre-commit>=3.6.2",
    "pytest>=8.1.1",
    "pylint>=3.1.0",
    "pylint-pytest>=1.1.7",
    "pytest-mock>=3.12.0",
    "ruff>=0.14.2",
    "jupyterlab>=4.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# Override torch to use CUDA 12.1 version from PyTorch index
# Use: uv sync --extra cuda
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
