params:
  - params.yaml

stages:
  build_histogram_xy:
    cmd: >-
      uv run python ${project_root}/stages/build_histogram_xy.py
      --params params.yaml
      --partitions genoa milan
      --cpus 8
      --mem 64GB
      --time 00:30:00
      --overwrite
    deps:
      - ${project_root}/src/features/build_histogram_xy.py
      - ${project_root}/${output.dir}/gbif/histograms.zarr
      - ${project_root}/${output.dir}/splot/histograms.zarr
      - ${project_root}/${eo_features.x_fp}
    params:
      - output.dir
      - output.xy_dir
      - eo_features.x_fp
      - target_resolution
    outs:
      - ${project_root}/${output.xy_dir}:
          persist: true

