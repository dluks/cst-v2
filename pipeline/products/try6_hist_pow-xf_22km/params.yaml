version: "2"
project_root: "../../.."
product_dir: "pipeline/products/try6_hist_pow-xf_22km"
trait_type: "try6"
product_code: "try6_hist_pow-xf_22km"

# Spatial configuration (must match histogram_data and eo_data pipelines)
target_resolution: 22000
crs: "EPSG:6933"
PFT: "Shrub_Tree_Grass"
random_seed: 42

# Histogram configuration (mirror of histogram_data params)
histogram:
  n_bins: 20
  label_smoothing_epsilon: 0.01

# ── Input paths ────────────────────────────────────────────────────────────

# EO predictor features (produced by pipeline/eo_data/modis_wc2_soil_canopy_vodca_alos_22km)
eo_features:
  x_fp: data/features/predict/modis_wc2_soil_canopy_vodca_alos_22km/X.parquet

# Histogram targets (produced by pipeline/histogram_data/try6_hist_pow-xf_22km)
output:
  dir: data/interim/histogram_targets/try6_hist_pow-xf_22km
  xy_dir: data/features/try6_hist_pow-xf_22km/xy_data

# Trait configuration (same as histogram_data pipeline)
traits:
  names:
    - X4    # Stem specific density (SSD) / wood density
    - X6    # Root rooting depth
    - X13   # Leaf carbon (C) content per leaf dry mass
    - X14   # Leaf nitrogen (N) content per leaf dry mass
    - X15   # Leaf phosphorus (P) content per leaf dry mass
    - X21   # Stem diameter
    - X26   # Seed dry mass
    - X27   # Seed length
    - X46   # Leaf thickness
    - X47   # Leaf dry matter content (LDMC)
    - X50   # Leaf nitrogen (N) content per leaf area
    - X55   # Leaf dry mass (single leaf)
    - X78   # Leaf nitrogen (N) isotope signature (delta 15N)
    - X95   # Seed germination rate
    - X138  # Seed number per reproduction unit
    - X144  # Leaf length
    - X145  # Leaf width
    - X146  # Leaf carbon/nitrogen (C/N) ratio
    - X163  # Leaf fresh mass
    - X169  # Stem conduit density (vessels and tracheids)
    - X237  # Dispersal unit length
    - X281  # Stem conduit diameter (vessels, tracheids)
    - X282  # Wood vessel element length
    - X289  # Wood fiber lengths
    - X297  # Wood rays per millimetre (wood ray density)
    - X614  # Specific fine root length (SRL)
    - X1080 # Specific root length (SRL)
    - X3106 # Plant height vegetative
    - X3114 # Leaf area
    - X3117 # Specific leaf area (SLA / 1/LMA)
    - X3120 # Leaf water content per leaf dry mass
  transformer_dir: data/interim/traits/try6_pow-xf/transformers

# ── Model training configuration ─────────────────────────────────────────
train:
  arch: histogram_mlp
  hidden_dims: [512, 256, 256]
  dropout: 0.2
  batch_size: 1024
  lr: 0.001
  weight_decay: 0.01
  max_epochs: 200
  patience: 20
  n_folds: 5
  h3_resolution: 1
  n_fold_iterations: 100
  standardize_features: true
  vodca_sentinel: 32767

models:
  dir_fp: models/try6_hist_pow-xf_22km

# ── HPO configuration ───────────────────────────────────────────────────
hpo:
  n_workers: 4
  n_trials_per_worker: 25
  hpo_fold: 0
